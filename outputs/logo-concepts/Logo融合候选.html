<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>时间的复利 · Logo融合候选</title><style>*{box-sizing:border-box}body{margin:0;background:#fafaf8;color:#202220;font:15px/1.7 "Microsoft YaHei",sans-serif}main{max-width:1100px;margin:auto;padding:36px 32px 48px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}.kicker{font:11px monospace;letter-spacing:2px;color:#686b64}h1{font-size:32px;font-weight:500;margin:8px 0}p{margin:4px 0;color:#686b64}button{border:1px solid #d9dbd5;background:transparent;border-radius:30px;padding:10px 18px;color:inherit;cursor:pointer;font:inherit}button:focus-visible{outline:2px solid #2152e7;outline-offset:3px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:28px}.card{border:1px solid #e4e5df;border-radius:17px;overflow:hidden;background:#eeeeeb;transition:box-shadow .2s}.card:hover{box-shadow:0 12px 32px #20222014}.meta{display:flex;justify-content:space-between;padding:18px 24px 0;font:11px monospace;letter-spacing:1px;color:#686b64}.canvas-wrap{height:300px;display:flex;align-items:center;justify-content:center}.canvas-wrap canvas{width:320px;height:300px}.detail{padding:12px 24px 20px;border-top:1px solid #d9dbd5}.detail h2{font-size:21px;font-weight:500;margin:0}.detail p{font-size:13px;min-height:24px}.small{display:flex;align-items:center;gap:20px;margin-top:14px}.small span{font:11px monospace;color:#686b64}.small canvas{flex:none}.wordmark{font-size:16px!important;font-family:"Microsoft YaHei",sans-serif!important;color:#202220!important;letter-spacing:2px}.dark .card{background:#111212;border-color:#111212;color:#fafaf8}.dark .meta,.dark .detail p,.dark .small span{color:#b8bbb3}.dark .wordmark{color:#fafaf8!important}.dark .detail{border-color:#41443d}footer{border-top:1px solid #d9dbd5;margin-top:28px;padding-top:18px;display:flex;justify-content:space-between;color:#686b64;font-size:12px}@media(max-width:700px){main{padding:24px 18px}.grid{grid-template-columns:1fr}header{align-items:start;flex-direction:column}.canvas-wrap{height:240px}footer{flex-direction:column;gap:8px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style><main><header><div><div class="kicker">THE LONG GAME / IDENTITY EXPLORATIONS</div><h1>时间之环，加入增长的轨迹。</h1><p>A方向 × 3.2图标 · 两种融合程度 · 不绑定资产数量</p></div><button id="theme">查看反白效果</button></header><section class="grid"><article class="card"><div class="meta"><span>A1 / TIME / GROWTH</span><span>01</span></div><div class="canvas-wrap"><canvas data-logo="0" width="640" height="600" aria-label="A1 时间轨迹"></canvas></div><div class="detail"><h2>A1 · 时间轨迹</h2><p>保留A的开口圆环，融入3.2的波动曲线。更适合小尺寸与开场过渡。</p><div class="small"><canvas data-logo="0" width="96" height="96" style="width:48px;height:48px"></canvas><span class="wordmark">时间的复利</span><canvas data-logo="0" width="64" height="64" style="width:32px;height:32px"></canvas><span>32 PX</span></div></div></article><article class="card"><div class="meta"><span>A2 / TIME / ACCUMULATION</span><span>02</span></div><div class="canvas-wrap"><canvas data-logo="1" width="640" height="600" aria-label="A2 积累之环"></canvas></div><div class="detail"><h2>A2 · 积累之环</h2><p>圆环中加入投入柱形与波动轨迹，让“持续投入”更有辨识度。</p><div class="small"><canvas data-logo="1" width="96" height="96" style="width:48px;height:48px"></canvas><span class="wordmark">时间的复利</span><canvas data-logo="1" width="64" height="64" style="width:32px;height:32px"></canvas><span>32 PX</span></div></div></article></section><footer><span>候选提案，仅供选择；未替换现有网页与开场。</span><span>OPEN RING / COMPOUNDING OVER TIME</span></footer></main><script>
function segment(x,y,a,b){let dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((x-a[0])*dx+(y-a[1])*dy)/(dx*dx+dy*dy)));return Math.hypot(x-a[0]-t*dx,y-a[1]-t*dy)}
// The same rising, fluctuating gesture as 3.2, fitted into the open ring.
const anchors=[[-.19,.105],[-.145,.088],[-.095,.005],[-.045,.024],[.005,.039],[.065,-.055],[.115,-.08],[.175,-.155]];
const curve=[];
for(let i=0;i<anchors.length-1;i++){
 let a=anchors[Math.max(0,i-1)],b=anchors[i],c=anchors[i+1],d=anchors[Math.min(anchors.length-1,i+2)];
 for(let j=0;j<12;j++){let t=j/12,t2=t*t,t3=t2*t;curve.push([0,1].map(k=>.5*((2*b[k])+(-a[k]+c[k])*t+(2*a[k]-5*b[k]+4*c[k]-d[k])*t2+(-a[k]+3*b[k]-3*c[k]+d[k])*t3)))}
}curve.push(anchors.at(-1));
function inside(k,x,y){
 let r=Math.hypot(x,y),a=Math.atan2(y,x);
 if(r>.275&&r<.385&&!(a>-.95&&a<-.2))return 1;
 if(curve.slice(1).some((b,i)=>segment(x,y,curve[i],b)<(k===0?.022:.017)))return 2;
 if(k===1){let xs=[-.18,-.10,-.02,.06,.14],tops=[.133,.067,.094,.0,-.052];for(let i=0;i<xs.length;i++)if(segment(x,y,[xs[i],tops[i]],[xs[i],.17])<.015)return 3;}
 return 0;
}
function draw(c){let k=+c.dataset.logo,w=c.width/2,h=c.height/2,ctx=c.getContext('2d');ctx.setTransform(2,0,0,2,0,0);ctx.clearRect(0,0,w,h);ctx.strokeStyle=document.body.classList.contains('dark')?'#fafaf8':'#202220';ctx.lineCap='round';let size=Math.min(w,h)*1.05,pitch=w>100?4:1.35,len=pitch*.73,weights=w>100?[.8,1.4,2.1,2.9]:[.35,.5,.7,.95];for(let px=w/2-size*.46;px<w/2+size*.46;px+=pitch)for(let py=h/2-size*.46;py<h/2+size*.46;py+=pitch){let x=(px-w/2)/size,y=(py-h/2)/size,coverage=0;for(let [dx,dy] of [[0,0],[-.003,0],[.003,0],[0,-.004],[0,.004]])if(inside(k,x+dx,y+dy))coverage++;if(!coverage)continue;ctx.lineWidth=weights[Math.min(3,Math.floor(coverage/1.3))];ctx.beginPath();ctx.moveTo(px,py-len/2);ctx.lineTo(px,py+len/2);ctx.stroke()}}
function render(){document.querySelectorAll('canvas').forEach(draw)}document.getElementById('theme').onclick=()=>{let d=document.body.classList.toggle('dark');document.getElementById('theme').textContent=d?'查看浅底效果':'查看反白效果';render()};render();
</script></html>
